[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-unused-resources"
version = "2.0.0"
description = "Read-only AWS unused resource scanner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "openpyxl",
    "typer",
    "rich"
]

[project.scripts]
aws-unused = "aws_unused.cli:app"

[tool.setuptools.packages.find]
include = ["aws_unused*"]